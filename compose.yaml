# Postgres with pgvector (vector search) and pg_search (BM25 keyword search), from the ParadeDB image.
# Pinned by digest: PostgreSQL 18.6, pg_search 0.26.2, vector 0.8.6.
# A fixed project name, so the container and its data don't depend on the folder's name.
name: aircraft-maintenance-rag
services:
  db:
    image: paradedb/paradedb@sha256:c552094b6b68dcb0a4e7a3969963d801eaec02490db4d2dd032dcb096bc86cf8
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-anfa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-anfa}
      POSTGRES_DB: ${POSTGRES_DB:-anfa}
    ports:
      - "${POSTGRES_PORT:-54329}:5432"
    volumes:
      - anfa-db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${POSTGRES_USER:-anfa} -d ${POSTGRES_DB:-anfa}"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  anfa-db:
