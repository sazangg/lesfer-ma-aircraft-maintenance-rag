# Postgres with pgvector (vector search) and pg_search (BM25 keyword search), from the ParadeDB image.
# Pinned by digest: PostgreSQL 18.6, pg_search 0.26.2, vector 0.8.6.
services:
  db:
    image: paradedb/paradedb@sha256:c552094b6b68dcb0a4e7a3969963d801eaec02490db4d2dd032dcb096bc86cf8
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-atlas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-atlas}
      POSTGRES_DB: ${POSTGRES_DB:-atlas}
    ports:
      - "${POSTGRES_PORT:-54329}:5432"
    volumes:
      - atlas-db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-atlas} -d ${POSTGRES_DB:-atlas}"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  atlas-db:
