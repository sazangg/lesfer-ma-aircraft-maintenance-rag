[project]
name = "aircraft-maintenance-rag"
version = "0.1.0"
description = "The assistant from Building Reliable AI Over Company Knowledge, built with real models over real aircraft maintenance documents."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.60",          # OpenRouter speaks the OpenAI API
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "python-dotenv>=1.0",
    "numpy>=1.26",
]

[dependency-groups]
# Turns the source documents (PDF, scan, Word, slides, HTML) into parser output.
parse = ["docling>=2.0"]
# Builds the source documents from the corpus definition. Only needed to regenerate them.
corpus = ["reportlab>=4.2", "python-docx>=1.1", "python-pptx>=1.0", "openpyxl>=3.1", "pillow>=10.4"]

[tool.uv]
package = false
